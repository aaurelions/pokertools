<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">PokerTools</title>
  <desc id="desc">A white spade on a green gradient rounded square</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ea06b"/>
      <stop offset="55%" stop-color="#1b6b50"/>
      <stop offset="100%" stop-color="#0e3d2c"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.18" r="0.85">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded tile with gradient + subtle ring -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Gloss highlight -->
  <rect width="64" height="64" rx="14" fill="url(#gloss)"/>

  <!-- Spade: point at top, two lobes, stem with base bar -->
  <path
    fill="#ffffff"
    d="M32 7
       C 41.5 15.5, 55.5 19.5, 55.5 33
       C 55.5 42.5, 48 50, 40.5 50
       C 37.8 50, 35.8 48.4, 34.4 44.6
       L 34.4 53
       L 41 58.5
       L 23 58.5
       L 29.6 53
       L 29.6 44.6
       C 28.2 48.4, 26.2 50, 23.5 50
       C 16 50, 8.5 42.5, 8.5 33
       C 8.5 19.5, 22.5 15.5, 32 7
       Z"/>
</svg>