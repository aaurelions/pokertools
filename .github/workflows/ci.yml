name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        # Pinned to current stable LTS. Expand to [24.x, 26.x] when Node 26 LTS lands.
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Supported Package Manager
        run: npm install --global npm@12.2.0

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Production Dependency Security Audit
        run: npm audit --omit=dev

      - name: Install Pinned Secret Scanner
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Secret Scan and Policy Canaries
        env:
          POKERTOOLS_TEST_TMPDIR: ${{ runner.temp }}
        run: |
          gitleaks dir . --config .gitleaks.toml --redact
          node scripts/test-secret-policy.mjs

      - name: Install Redis CLI
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Lint Code
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: Build All Packages
        run: npm run build

      - name: Check Architecture Boundaries
        run: npm run check:boundaries

      - name: Check Public Package Contents
        run: node scripts/check-publish-contents.mjs

      - name: Validate Schema & Migrations
        run: |
          cd packages/api
          node scripts/validate-migrations.mjs

      - name: Run Tests (coverage gates)
        env:
          NODE_ENV: "test"
          ENABLE_HEAVY_TESTS: "true"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test-jwt-secret-key-for-ci-minimum-32-chars"
          COOKIE_SECRET: "test-cookie-secret-key-for-ci"
        run: npm run test:coverage

      - name: Postgres Acceptance (disposable containers)
        run: |
          npm run test:postgres:migrations -w @pokertools/api
          npm run test:postgres:ledger -w @pokertools/api

      - name: Canonical PostgreSQL, Redis and HTTP Acceptance
        run: npm run test:canonical -w @pokertools/api

      - name: Local-chain Financial Acceptance
        run: npm run e2e:finance

      - name: Run Benchmarks
        if: matrix.node-version == '24.x'
        run: npm run bench

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
